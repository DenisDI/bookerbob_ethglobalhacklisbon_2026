name: Deploy Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy BookerBob (fairterms-lisbon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # Privy App ID is public; Vite needs it at image build time.
        # Set repo Variable (or Secret) VITE_LISBON2026_PRIVY_APP_ID.
        run: >
          flyctl deploy --remote-only
          --build-arg VITE_LISBON2026_PRIVY_APP_ID=${{ vars.VITE_LISBON2026_PRIVY_APP_ID }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
