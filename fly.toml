# BookerBob — ETHGlobal Lisbon 2026
# Fly app id stays fairterms-lisbon (already live) → https://lisbonhack.world
#
# Deploy: fly deploy
# Auto: .github/workflows/deploy.yml on push to main

app = "fairterms-lisbon"
primary_region = "ams"

[build]

[env]
  # Not a secret. An AgentKit credential is bound to the resource it was issued
  # for, and TLS terminates at the Fly edge, so the socket says http while every
  # agent signs https. Without this the gateway would compare against the wrong
  # string and refuse credentials that are perfectly good.
  LISBON2026_PUBLIC_URL = "https://lisbonhack.world"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
